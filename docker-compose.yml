name: ai-platform-java-local

x-java-environment: &java-environment
  ENVIRONMENT: local
  JDBC_DATABASE_URL: ${JDBC_DATABASE_URL:-jdbc:postgresql://postgres:5432/ai_platform}
  DATABASE_USERNAME: ${POSTGRES_USER:-ai_platform}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_TLS_ENABLED: "false"
  DATABASE_MIGRATIONS_ENABLED: "false"
  SEED_ALLOW_COMPOSE_NETWORK: "true"
  OPERATOR_AUTH_MODE: disabled

services:
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ai_platform
      POSTGRES_USER: ${POSTGRES_USER:-ai_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - java-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ai_platform"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.2.16-alpine@sha256:b5dee736fa6758052556cc97b5d5423177dcd8e26ce9746e6e3d58484a5a4143
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migration:
    image: production-ai-platform-migration:local
    build:
      context: .
      dockerfile: apps/api-java/Dockerfile
      target: migration
    environment: *java-environment
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    image: production-ai-platform-api:local
    build:
      context: .
      dockerfile: apps/api-java/Dockerfile
      target: api
    environment:
      <<: *java-environment
      SEED_LOCAL_DATA: "true"
      LIMITS_NAMESPACE: ai-platform-java-local
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 60s
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: production-ai-platform-web:local
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: local
      API_BASE_URL: http://api:8000
      # Explicit isolated fixture mode; never reads real gateway usage or grants writes.
      WEB_AUTH_MODE: synthetic_demo
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  # New names preserve legacy Python data and require explicit migration adoption.
  java-postgres-data:
