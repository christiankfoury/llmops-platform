clusterName: replace-with-approved-cluster
region: us-east-1
vpcId: vpc-00000000000000000
watchNamespace: ai-platform-dev
replicaCount: 2
serviceAccount:
  create: false
  name: aws-load-balancer-controller
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
rbac:
  create: false
enableServiceMutatorWebhook: false
controllerConfig:
  featureGates:
    EnableServiceController: false
    NLBGatewayAPI: false
    ALBGatewayAPI: false
    GlobalAcceleratorController: false
    EndpointsFailOpen: false
# v3.5.0 always starts the Ingress informer; RBAC and admission keep it read-only.
ingressClass: tgb-unmanaged
createIngressClassResource: false
ingressClassParams:
  create: false
enableBackendSecurityGroup: false
enableManageBackendSecurityGroupRules: false
enableShield: false
enableWaf: false
enableWafv2: false
disableIngressClassAnnotation: true
disableIngressGroupNameAnnotation: true
podMutatorWebhookConfig:
  failurePolicy: Fail
