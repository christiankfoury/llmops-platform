clusterName: replace-with-approved-cluster
region: us-east-1
vpcId: vpc-00000000000000000
watchNamespace: ai-platform-dev
replicaCount: 2
serviceAccount:
  create: false
  name: aws-load-balancer-controller
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
podSecurityContext:
  fsGroup: 65534
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
rbac:
  create: false
enableServiceMutatorWebhook: false
controllerConfig:
  featureGates:
    EnableServiceController: false
    NLBGatewayAPI: false
    ALBGatewayAPI: false
    GlobalAcceleratorController: false
