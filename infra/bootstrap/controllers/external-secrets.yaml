# Controller RBAC is cluster-owned; only the dedicated reader SAs receive AWS identities.
replicaCount: 2
installCRDs: true
serviceAccount:
  name: external-secrets
rbac:
  serviceAccountTokenCreate: false
  aggregateToView: false
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
webhook:
  replicaCount: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}
certController:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}
