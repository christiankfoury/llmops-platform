# Namespace-scoped v1-only reconcilers; the bootstrap release owns structural CRDs.
installCRDs: false
replicaCount: 2
leaderElect: true
scopedRBAC: true
scopedNamespace: ai-platform-dev
serviceAccount:
  name: external-secrets-runtime
rbac:
  create: true
  serviceAccountTokenCreate: false
  aggregateToView: false
  servicebindings:
    create: false
webhook:
  create: false
certController:
  create: false
crds:
  conversion:
    enabled: false
  unsafeServeV1Beta1: false
processClusterStore: false
processClusterExternalSecret: false
processClusterPushSecret: false
processClusterGenerator: false
processPushSecret: false
openshiftFinalizers: false
podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
