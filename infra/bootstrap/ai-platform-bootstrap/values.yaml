environment: dev
region: us-east-1
vpcCidr: 10.20.0.0/16
# Install policies before ordinary-pod add-ons/controllers. Enable stores only after ESO CRDs exist.
externalSecretsEnabled: false
secretPrefix: production-ai-platform-dev
roles:
  runtime: arn:aws:iam::000000000000:role/replace-runtime-reader
  migration: arn:aws:iam::000000000000:role/replace-migration-reader
  loadBalancer: arn:aws:iam::000000000000:role/replace-load-balancer-controller
