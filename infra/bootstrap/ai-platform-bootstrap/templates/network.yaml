# These policies must exist before CoreDNS/CSI and ordinary controller pods start.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-dns
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock:
            cidr: {{ .Values.vpcCidr }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-system-controllers
  namespace: kube-system
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [aws-load-balancer-controller, aws-ebs-csi-driver]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.vpcCidr }}
      ports:
        - {protocol: TCP, port: 9443}
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-external-secrets
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.vpcCidr }}
      ports:
        - {protocol: TCP, port: 10250}
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migration-isolation
  namespace: ai-platform-{{ .Values.environment }}-migration
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: TCP, port: 53}
        - {protocol: UDP, port: 53}
    - to:
        - ipBlock:
            cidr: {{ .Values.vpcCidr }}
      ports:
        - {protocol: TCP, port: 5432}

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-ebs-controller
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: ebs-csi-controller
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bootstrap-metrics-server
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      k8s-app: metrics-server
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.vpcCidr }}
      ports:
        - {protocol: TCP, port: 10251}
        - {protocol: TCP, port: 10250}
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: {{ .Values.vpcCidr }}
      ports:
        - {protocol: TCP, port: 10250}
