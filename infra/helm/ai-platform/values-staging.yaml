namespace:
  create: true
  name: ai-platform-staging
externalSecrets:
  runtime:
    remoteKey: production-ai-platform-staging/runtime
api:
  replicaCount: 2
  image:
    repository: replace-with-staging-ecr/production-ai-platform/api
    tag: staging
  config:
    environment: staging
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    scaleUpStabilizationWindowSeconds: 60
    scaleDownStabilizationWindowSeconds: 300
web:
  replicaCount: 2
  image:
    repository: replace-with-staging-ecr/production-ai-platform/web
    tag: staging
  config:
    origin: https://staging.ai-platform.example.com
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    scaleUpStabilizationWindowSeconds: 60
    scaleDownStabilizationWindowSeconds: 300
ingress:
  webHost: staging.ai-platform.example.com
  apiHost: api.staging.ai-platform.example.com
migration:
  image:
    repository: replace-with-staging-ecr/production-ai-platform/migration
    tag: staging
