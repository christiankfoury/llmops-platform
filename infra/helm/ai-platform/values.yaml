nameOverride: ""
fullnameOverride: ""

namespace:
  create: false
  name: ""

imagePullSecrets: []

commonLabels:
  app.kubernetes.io/part-of: production-ai-platform

runtimeSecret:
  name: ai-platform-runtime-secrets
  databaseUrlKey: database-url
  redisUrlKey: redis-url

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStore:
    create: true
    name: ai-platform-secrets-manager
    kind: ClusterSecretStore
    region: us-east-1
    service: SecretsManager
    controllerServiceAccountName: external-secrets
    controllerServiceAccountNamespace: external-secrets
  runtime:
    remoteKey: production-ai-platform-dev/runtime
    databaseUrlProperty: database-url
    redisUrlProperty: redis-url

networkPolicy:
  enabled: true
  ingressCidrs:
    - 10.0.0.0/8

api:
  replicaCount: 2
  image:
    repository: production-ai-platform-api
    tag: latest
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    automountServiceAccountToken: false
    annotations: {}
  config:
    environment: dev
    corsOrigins: https://ai-platform.example.com
    tracingEnabled: "false"
    otelServiceName: production-ai-platform-api
    otelTracesExporter: console
    otelExporterOtlpEndpoint: ""
    rateLimitEnabled: "true"
    rateLimitRequestsPerMinute: "60"
    rateLimitWindowSeconds: "60"
    providerMaxAttempts: "2"
    providerRetryBackoffMs: "100"
    providerTimeoutSeconds: "15"
  service:
    type: ClusterIP
    port: 8000
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "8000"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      path: /health/ready
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /health/live
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  lifecycle:
    terminationGracePeriodSeconds: 30
    preStopSleepSeconds: 5
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    scaleUpStabilizationWindowSeconds: 60
    scaleDownStabilizationWindowSeconds: 300
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

web:
  replicaCount: 2
  image:
    repository: production-ai-platform-web
    tag: latest
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ""
    automountServiceAccountToken: false
    annotations: {}
  config:
    apiBaseUrl: https://api.ai-platform.example.com
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  lifecycle:
    terminationGracePeriodSeconds: 30
    preStopSleepSeconds: 5
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    scaleUpStabilizationWindowSeconds: 60
    scaleDownStabilizationWindowSeconds: 300
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  webHost: ai-platform.example.com
  apiHost: api.ai-platform.example.com
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
