nameOverride: ''
release:
  requireDigests: false
fullnameOverride: ''
namespace:
  name: ''
imagePullSecrets: []
commonLabels:
  app.kubernetes.io/part-of: production-ai-platform
runtimeSecret:
  name: ai-platform-runtime-secrets
  keys:
    JDBC_DATABASE_URL: jdbc-database-url
    DATABASE_USERNAME: database-username
    DATABASE_PASSWORD: database-password
    REDIS_HOST: redis-host
    REDIS_PORT: redis-port
    REDIS_USERNAME: redis-username
    REDIS_PASSWORD: redis-password
networkPolicy:
  enabled: true
  ingressCidrs:
  - 10.0.0.0/8
api:
  replicaCount: 2
  image:
    repository: production-ai-platform-api
    digest: ''
    tag: latest
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ''
    automountServiceAccountToken: false
    annotations: {}
  config:
    environment: dev
    operatorAuthMode: disabled
    oidcIssuer: ''
    oidcAudience: ''
    oidcJwksUri: ''
    otlpTracesEndpoint: ''
    traceSampleProbability: '0.1'
    globalRequestLimit: '600'
    gatewayKeyRequestLimit: '60'
    telemetryKeyRequestLimit: '300'
    rateLimitWindowSeconds: '60'
    maxConcurrentRequests: '32'
    providerMaxAttempts: '2'
    providerRetryBackoffMs: '100'
    providerTimeoutSeconds: '15'
    providerConcurrency: '8'
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  probes:
    readiness:
      path: /health/ready
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /health/live
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /health/live
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 36
  lifecycle:
    terminationGracePeriodSeconds: 60
    preStopSleepSeconds: 5
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    scaleUpStabilizationWindowSeconds: 60
    scaleDownStabilizationWindowSeconds: 300
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
web:
  replicaCount: 2
  image:
    repository: production-ai-platform-web
    digest: ''
    tag: latest
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ''
    automountServiceAccountToken: false
    annotations: {}
  config:
    apiBaseUrl: ''
    authMode: disabled
    origin: https://ai-platform.example.com
    oidcIssuer: ''
    oidcClientId: ''
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  lifecycle:
    terminationGracePeriodSeconds: 30
    preStopSleepSeconds: 5
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    scaleUpStabilizationWindowSeconds: 60
    scaleDownStabilizationWindowSeconds: 300
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  sessionSecretName: ai-platform-web-session
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  webHost: ai-platform.example.com
  apiHost: api.ai-platform.example.com
  tls: []
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
databaseTrust:
  configMapName: ai-platform-database-ca
  key: postgres-root.pem
metrics:
  enabled: true
  namespaceSelector:
    kubernetes.io/metadata.name: observability
  podSelector:
    app.kubernetes.io/name: prometheus
