apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-platform.webName" . }}-config
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  API_BASE_URL: {{ .Values.web.config.apiBaseUrl | quote }}
