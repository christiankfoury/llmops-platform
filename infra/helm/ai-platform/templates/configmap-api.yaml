apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-platform.apiName" . }}-config
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  ENVIRONMENT: {{ .Values.api.config.environment | quote }}
  API_CORS_ORIGINS: {{ .Values.api.config.corsOrigins | quote }}
  OTEL_TRACING_ENABLED: {{ .Values.api.config.tracingEnabled | quote }}
  OTEL_SERVICE_NAME: {{ .Values.api.config.otelServiceName | quote }}
  OTEL_TRACES_EXPORTER: {{ .Values.api.config.otelTracesExporter | quote }}
  RATE_LIMIT_ENABLED: {{ .Values.api.config.rateLimitEnabled | quote }}
  RATE_LIMIT_REQUESTS_PER_MINUTE: {{ .Values.api.config.rateLimitRequestsPerMinute | quote }}
  RATE_LIMIT_WINDOW_SECONDS: {{ .Values.api.config.rateLimitWindowSeconds | quote }}
  {{- if .Values.api.config.otelExporterOtlpEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.api.config.otelExporterOtlpEndpoint | quote }}
  {{- end }}
