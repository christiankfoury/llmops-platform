{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ai-platform.apiName" . }}-runtime
  namespace: {{ include "ai-platform.namespace" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind }}
  target:
    name: {{ .Values.runtimeSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.runtimeSecret.databaseUrlKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.runtime.remoteKey }}
        property: {{ .Values.externalSecrets.runtime.databaseUrlProperty }}
    - secretKey: {{ .Values.runtimeSecret.redisUrlKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.runtime.remoteKey }}
        property: {{ .Values.externalSecrets.runtime.redisUrlProperty }}
{{- end }}
