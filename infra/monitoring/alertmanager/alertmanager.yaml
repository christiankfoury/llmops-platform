global:
  resolve_timeout: 5m

route:
  receiver: platform-null
  group_by:
    - alertname
    - service
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: platform-null
    webhook_configs:
      - url: http://example-alert-receiver.invalid/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal:
      - alertname
      - service
