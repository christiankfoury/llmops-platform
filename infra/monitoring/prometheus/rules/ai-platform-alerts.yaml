groups:
  - name: ai-platform.gateway
    interval: 30s
    rules:
      - alert: AIGatewayHighErrorRate
        expr: |
          100 * sum(rate(llm_gateway_errors_total[5m]))
          / clamp_min(sum(rate(llm_gateway_requests_total[5m])), 1) > 5
        for: 10m
        labels:
          severity: warning
          service: ai-platform-api
        annotations:
          summary: AI gateway error rate is above 5%
          description: Gateway errors have exceeded 5% of gateway requests for 10 minutes.
          runbook_url: docs/runbook.md#high-error-rate

      - alert: AIGatewayHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(llm_gateway_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: ai-platform-api
        annotations:
          summary: AI gateway p95 latency is above 2 seconds
          description: Gateway p95 latency has stayed above 2 seconds for 10 minutes.
          runbook_url: docs/runbook.md#high-latency

      - alert: AIGatewayElevated5xxRate
        expr: |
          100 * sum(rate(http_requests_total{status_code=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requests_total[5m])), 1) > 2
        for: 10m
        labels:
          severity: critical
          service: ai-platform-api
        annotations:
          summary: API 5xx rate is above 2%
          description: API 5xx responses have exceeded 2% of HTTP requests for 10 minutes.
          runbook_url: docs/runbook.md#high-error-rate

      - alert: AIGatewayCostSpike
        expr: sum(increase(llm_gateway_estimated_cost_usd_total[1h])) > 5
        for: 15m
        labels:
          severity: warning
          service: ai-platform-api
        annotations:
          summary: Estimated LLM cost has spiked
          description: Estimated gateway cost has exceeded $5 in the last hour.
          runbook_url: docs/runbook.md#cost-spike

  - name: ai-platform.infrastructure
    interval: 30s
    rules:
      - alert: AIPlatformPodRestarts
        expr: |
          sum by (namespace, pod) (
            increase(kube_pod_container_status_restarts_total{namespace=~"ai-platform-.*"}[15m])
          ) > 0
        for: 5m
        labels:
          severity: warning
          service: ai-platform
        annotations:
          summary: AI Platform pod restarted
          description: Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted within the last 15 minutes.
          runbook_url: docs/runbook.md#api-pods-crash-looping

      - alert: AIPlatformDatabaseUnavailable
        expr: pg_up{job=~"ai-platform-postgres|rds-postgres"} == 0
        for: 5m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: PostgreSQL exporter reports database unavailable
          description: PostgreSQL target {{ $labels.instance }} has reported pg_up=0 for 5 minutes.
          runbook_url: docs/runbook.md#database-connectivity-failure
