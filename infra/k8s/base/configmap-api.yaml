apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-api-config
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-platform-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: production-ai-platform
data:
  ENVIRONMENT: dev
  API_CORS_ORIGINS: https://ai-platform.example.com
  OTEL_TRACING_ENABLED: "false"
  OTEL_SERVICE_NAME: production-ai-platform-api
  OTEL_TRACES_EXPORTER: console
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
  RATE_LIMIT_WINDOW_SECONDS: "60"
