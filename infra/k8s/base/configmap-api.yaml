apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-api-config
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-platform-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: production-ai-platform
data:
  PORT: '8000'
  API_BIND_ADDRESS: 0.0.0.0
  MANAGEMENT_PORT: '9080'
  DATABASE_MIGRATIONS_ENABLED: 'false'
  SEED_LOCAL_DATA: 'false'
  SEED_ALLOW_COMPOSE_NETWORK: 'false'
  REDIS_TLS_ENABLED: 'true'
  JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m -XX:MaxDirectMemorySize=128m -XX:+ExitOnOutOfMemoryError
    -Djava.io.tmpdir=/tmp
  MANAGEMENT_BIND_ADDRESS: 0.0.0.0
  LIMITS_NAMESPACE: ai-platform-dev
  ENVIRONMENT: dev
  OPERATOR_AUTH_MODE: disabled
  OIDC_ISSUER: ''
  OIDC_AUDIENCE: ''
  OIDC_JWKS_URI: ''
  OTLP_TRACES_ENDPOINT: ''
  TRACE_SAMPLE_PROBABILITY: '0.1'
  GLOBAL_REQUEST_LIMIT: '600'
  GATEWAY_KEY_REQUEST_LIMIT: '60'
  TELEMETRY_KEY_REQUEST_LIMIT: '300'
  RATE_LIMIT_WINDOW_SECONDS: '60'
  MAX_CONCURRENT_REQUESTS: '32'
  PROVIDER_MAX_ATTEMPTS: '2'
  PROVIDER_RETRY_BACKOFF_MS: '100'
  PROVIDER_TIMEOUT_SECONDS: '15'
  PROVIDER_CONCURRENCY: '8'
