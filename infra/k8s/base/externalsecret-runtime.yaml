apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-platform-runtime
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-platform-runtime
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: production-ai-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ai-platform-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ai-platform-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: production-ai-platform-dev/runtime
        property: database-url
    - secretKey: redis-url
      remoteRef:
        key: production-ai-platform-dev/runtime
        property: redis-url
