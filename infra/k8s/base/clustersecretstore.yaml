apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: ai-platform-secrets-manager
  labels:
    app.kubernetes.io/name: ai-platform-secrets-manager
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: production-ai-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
