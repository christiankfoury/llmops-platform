apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-platform-web-config
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-platform-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: production-ai-platform
data:
  ENVIRONMENT: dev
  API_BASE_URL: http://ai-platform-api:8000
  WEB_AUTH_MODE: disabled
  WEB_ORIGIN: https://ai-platform.example.com
  OIDC_ISSUER: ''
  OIDC_CLIENT_ID: ''
  OIDC_AUDIENCE: ''
