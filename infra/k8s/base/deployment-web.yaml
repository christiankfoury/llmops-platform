apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-platform-web
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: ai-platform-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: production-ai-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-platform-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-platform-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: production-ai-platform
    spec:
      serviceAccountName: ai-platform-web
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: production-ai-platform-web
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 5
        envFrom:
        - configMapRef:
            name: ai-platform-web-config
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: next-cache
          mountPath: /app/.next/cache
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: next-cache
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
