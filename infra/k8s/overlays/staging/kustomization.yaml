apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-platform-staging
resources:
- ../../base
images:
- name: replace-with-ecr/production-ai-platform/api
  newName: replace-with-staging-ecr/production-ai-platform/api
  newTag: staging
- name: replace-with-ecr/production-ai-platform/web
  newName: replace-with-staging-ecr/production-ai-platform/web
  newTag: staging
patches:
- target:
    kind: Deployment
    name: ai-platform-api
  patch: "- op: replace\n  path: /spec/replicas\n  value: 2"
- target:
    kind: Deployment
    name: ai-platform-web
  patch: "- op: replace\n  path: /spec/replicas\n  value: 2"
- target:
    kind: ConfigMap
    name: ai-platform-api-config
  patch: "- op: replace\n  path: /data/ENVIRONMENT\n  value: staging\n- op: replace\n\
    \  path: /data/LIMITS_NAMESPACE\n  value: ai-platform-staging"
- target:
    kind: ExternalSecret
    name: ai-platform-runtime
  patch: "- op: replace\n  path: /spec/data/0/remoteRef/key\n  value: production-ai-platform-staging/runtime\n\
    - op: replace\n  path: /spec/data/1/remoteRef/key\n  value: production-ai-platform-staging/runtime\n\
    - op: replace\n  path: /spec/data/2/remoteRef/key\n  value: production-ai-platform-staging/runtime\n\
    - op: replace\n  path: /spec/data/3/remoteRef/key\n  value: production-ai-platform-staging/runtime\n\
    - op: replace\n  path: /spec/data/4/remoteRef/key\n  value: production-ai-platform-staging/runtime\n\
    - op: replace\n  path: /spec/data/5/remoteRef/key\n  value: production-ai-platform-staging/runtime\n\
    - op: replace\n  path: /spec/data/6/remoteRef/key\n  value: production-ai-platform-staging/runtime"
- target:
    kind: ConfigMap
    name: ai-platform-web-config
  patch: "- op: replace\n  path: /data/ENVIRONMENT\n  value: staging\n- op: replace\n\
    \  path: /data/WEB_ORIGIN\n  value: https://staging.ai-platform.example.com"
- target:
    kind: Ingress
    name: ai-platform
  patch: "- op: replace\n  path: /spec/rules/0/host\n  value: staging.ai-platform.example.com\n\
    - op: replace\n  path: /spec/rules/1/host\n  value: api.staging.ai-platform.example.com"
