apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-platform-dev
resources:
- ../../base
images:
- name: replace-with-ecr/production-ai-platform/api
  newName: replace-with-dev-ecr/production-ai-platform/api
  newTag: dev
- name: replace-with-ecr/production-ai-platform/web
  newName: replace-with-dev-ecr/production-ai-platform/web
  newTag: dev
patches:
- target:
    kind: Deployment
    name: ai-platform-api
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1"
- target:
    kind: Deployment
    name: ai-platform-web
  patch: "- op: replace\n  path: /spec/replicas\n  value: 1"
- target:
    kind: HorizontalPodAutoscaler
    name: ai-platform-api
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1\n- op: replace\n  path:\
    \ /spec/maxReplicas\n  value: 2"
- target:
    kind: HorizontalPodAutoscaler
    name: ai-platform-web
  patch: "- op: replace\n  path: /spec/minReplicas\n  value: 1\n- op: replace\n  path:\
    \ /spec/maxReplicas\n  value: 2"
- target:
    kind: ConfigMap
    name: ai-platform-api-config
  patch: "- op: replace\n  path: /data/ENVIRONMENT\n  value: dev\n- op: replace\n\
    \  path: /data/LIMITS_NAMESPACE\n  value: ai-platform-dev"
- target:
    kind: ConfigMap
    name: ai-platform-web-config
  patch: "- op: replace\n  path: /data/ENVIRONMENT\n  value: dev\n- op: replace\n\
    \  path: /data/WEB_ORIGIN\n  value: https://dev.ai-platform.example.com"
- target:
    kind: Ingress
    name: ai-platform
  patch: "- op: replace\n  path: /spec/rules/0/host\n  value: dev.ai-platform.example.com\n\
    - op: replace\n  path: /spec/rules/1/host\n  value: api.dev.ai-platform.example.com"
