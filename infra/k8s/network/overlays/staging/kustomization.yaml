apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-platform-staging
resources:
- ../../base
patches:
- target:
    kind: Ingress
    name: ai-platform
  patch: "- op: replace\n  path: /spec/rules/0/host\n  value: staging.ai-platform.example.com\n\
    - op: replace\n  path: /spec/rules/1/host\n  value: api.staging.ai-platform.example.com"
