name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back.
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      revision:
        description: Helm revision number to roll back to.
        required: true
        type: string
      reason:
        description: Incident or release reason for the rollback.
        required: true
        type: string
      confirmation:
        description: Type rollback for dev/staging or rollback-prod for prod.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: rollback-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEV_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
      AWS_STAGING_DEPLOY_ROLE_ARN: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
      AWS_PROD_DEPLOY_ROLE_ARN: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
      DEV_EKS_CLUSTER_NAME: ${{ vars.DEV_EKS_CLUSTER_NAME }}
      STAGING_EKS_CLUSTER_NAME: ${{ vars.STAGING_EKS_CLUSTER_NAME }}
      PROD_EKS_CLUSTER_NAME: ${{ vars.PROD_EKS_CLUSTER_NAME }}
      DEV_NAMESPACE: ${{ vars.DEV_NAMESPACE }}
      STAGING_NAMESPACE: ${{ vars.STAGING_NAMESPACE }}
      PROD_NAMESPACE: ${{ vars.PROD_NAMESPACE }}
      DEV_API_BASE_URL: ${{ vars.DEV_API_BASE_URL }}
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
      PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
      DEV_WEB_BASE_URL: ${{ vars.DEV_WEB_BASE_URL }}
      STAGING_WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL }}
      PROD_WEB_BASE_URL: ${{ vars.PROD_WEB_BASE_URL }}
      TARGET_ENVIRONMENT: ${{ github.event.inputs.environment }}
      HELM_REVISION: ${{ github.event.inputs.revision }}
      ROLLBACK_REASON: ${{ github.event.inputs.reason }}
      ROLLBACK_CONFIRMATION: ${{ github.event.inputs.confirmation }}
    steps:
      - name: Resolve rollback target
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_REGION:?Set AWS_REGION as a repository variable.}"

          if ! [[ "$HELM_REVISION" =~ ^[0-9]+$ ]]; then
            echo "Helm revision must be a numeric release revision." >&2
            exit 1
          fi

          case "$TARGET_ENVIRONMENT" in
            dev)
              expected_confirmation="rollback"
              role_arn="$AWS_DEV_DEPLOY_ROLE_ARN"
              cluster_name="$DEV_EKS_CLUSTER_NAME"
              namespace="${DEV_NAMESPACE:-ai-platform-dev}"
              release_name="ai-platform-dev"
              api_base_url="$DEV_API_BASE_URL"
              web_base_url="$DEV_WEB_BASE_URL"
              timeout="10m"
              ;;
            staging)
              expected_confirmation="rollback"
              role_arn="$AWS_STAGING_DEPLOY_ROLE_ARN"
              cluster_name="$STAGING_EKS_CLUSTER_NAME"
              namespace="${STAGING_NAMESPACE:-ai-platform-staging}"
              release_name="ai-platform-staging"
              api_base_url="$STAGING_API_BASE_URL"
              web_base_url="$STAGING_WEB_BASE_URL"
              timeout="15m"
              ;;
            prod)
              expected_confirmation="rollback-prod"
              role_arn="$AWS_PROD_DEPLOY_ROLE_ARN"
              cluster_name="$PROD_EKS_CLUSTER_NAME"
              namespace="${PROD_NAMESPACE:-ai-platform-prod}"
              release_name="ai-platform-prod"
              api_base_url="$PROD_API_BASE_URL"
              web_base_url="$PROD_WEB_BASE_URL"
              timeout="20m"
              ;;
            *)
              echo "Unsupported environment: $TARGET_ENVIRONMENT" >&2
              exit 1
              ;;
          esac

          if [ "$ROLLBACK_CONFIRMATION" != "$expected_confirmation" ]; then
            echo "Rollback confirmation must be $expected_confirmation for $TARGET_ENVIRONMENT." >&2
            exit 1
          fi

          : "${role_arn:?Set the deployment role ARN variable for $TARGET_ENVIRONMENT.}"
          : "${cluster_name:?Set the EKS cluster name variable for $TARGET_ENVIRONMENT.}"
          : "${api_base_url:?Set the API base URL variable for $TARGET_ENVIRONMENT.}"
          : "${web_base_url:?Set the web base URL variable for $TARGET_ENVIRONMENT.}"

          {
            echo "role_arn=$role_arn"
            echo "cluster_name=$cluster_name"
            echo "namespace=$namespace"
            echo "release_name=$release_name"
            echo "api_base_url=$api_base_url"
            echo "web_base_url=$web_base_url"
            echo "timeout=$timeout"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ steps.resolve.outputs.role_arn }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Configure Kubernetes context
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.resolve.outputs.cluster_name }}"

      - name: Capture release history before rollback
        shell: bash
        run: |
          set -euo pipefail
          helm history "${{ steps.resolve.outputs.release_name }}" \
            --namespace "${{ steps.resolve.outputs.namespace }}" \
            --max 10

      - name: Roll back Helm release
        shell: bash
        run: |
          set -euo pipefail
          helm rollback "${{ steps.resolve.outputs.release_name }}" "$HELM_REVISION" \
            --namespace "${{ steps.resolve.outputs.namespace }}" \
            --wait \
            --timeout "${{ steps.resolve.outputs.timeout }}"

      - name: Check rollout status
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/${{ steps.resolve.outputs.release_name }}-api \
            --namespace "${{ steps.resolve.outputs.namespace }}" \
            --timeout "${{ steps.resolve.outputs.timeout }}"
          kubectl rollout status deployment/${{ steps.resolve.outputs.release_name }}-web \
            --namespace "${{ steps.resolve.outputs.namespace }}" \
            --timeout "${{ steps.resolve.outputs.timeout }}"

      - name: Smoke test rollback
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "${{ steps.resolve.outputs.api_base_url }}/health/ready"
          curl --fail --show-error --silent "${{ steps.resolve.outputs.web_base_url }}" > /dev/null

      - name: Record rollback summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Rollback summary"
            echo ""
            echo "- Environment: \`$TARGET_ENVIRONMENT\`"
            echo "- Release: \`${{ steps.resolve.outputs.release_name }}\`"
            echo "- Namespace: \`${{ steps.resolve.outputs.namespace }}\`"
            echo "- Target revision: \`$HELM_REVISION\`"
            echo "- Requested by: \`$GITHUB_ACTOR\`"
            echo ""
            echo "### Reason"
            printf '%s\n' "$ROLLBACK_REASON"
            echo ""
            echo "### Follow-up"
            echo "- Confirm dashboard health and error rate after rollback."
            echo "- Open or update the incident timeline."
            echo "- Decide whether to hotfix, revert, or continue investigation."
          } >> "$GITHUB_STEP_SUMMARY"
