name: Compatible application rollback
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Approved target environment
        required: true
        type: choice
        options: [dev, staging, prod]
      sha:
        description: Full compatible prior commit with successful CI evidence
        required: true
        type: string
      ci_run_id:
        description: Successful exact-revision CI run ID
        required: true
        type: string
      schema_version:
        description: Current live schema version (verified again before rollback)
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: aws-release-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      environment: ${{ inputs.environment }}
      operation: rollback
      sha: ${{ inputs.sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
      schema_version: ${{ inputs.schema_version }}
      previous_run_id: '0'
