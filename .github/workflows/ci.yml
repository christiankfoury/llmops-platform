name: CI

# Run the same validation on pushes to main and on pull requests targeting main.
# This keeps direct commits and proposed changes under the same quality gate.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  java:
    name: Java build and contract foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-java
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify committed Maven Wrapper integrity
        run: sha256sum --check .mvn/wrapper/SHA256SUMS

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api-java/pom.xml

      - name: Verify Java build, formatting, and HTTP boundaries
        run: ./mvnw --batch-mode --no-transfer-progress --strict-checksums clean verify

      - name: Smoke-test the packaged Java service
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          with open("target/packaged-smoke.log", "w") as log:
              process = subprocess.Popen([
                  "java", "-jar", "target/production-ai-platform-api-0.1.0-SNAPSHOT.jar",
                  "--server.port=18080",
              ], stdout=log, stderr=subprocess.STDOUT)
              try:
                  for attempt in range(30):
                      if process.poll() is not None:
                          raise RuntimeError("Packaged service exited during startup")
                      try:
                          with urllib.request.urlopen("http://127.0.0.1:18080/health/ready", timeout=1) as response:
                              if json.load(response)["status"] == "ready":
                                  break
                      except (OSError, urllib.error.HTTPError):
                          time.sleep(1)
                  else:
                      raise RuntimeError("Packaged service never became ready")
                  for path in ("/health", "/health/live", "/actuator/health"):
                      with urllib.request.urlopen("http://127.0.0.1:18080" + path, timeout=2) as response:
                          assert response.status == 200
                  for path in ("/actuator/env", "/contract-test/validate"):
                      try:
                          urllib.request.urlopen("http://127.0.0.1:18080" + path, timeout=2)
                      except urllib.error.HTTPError as error:
                          assert error.code == 404
                      else:
                          raise RuntimeError("Unexpected exposed endpoint: " + path)
                  print("Packaged Java health and endpoint exposure checks passed")
              finally:
                  process.terminate()
                  try:
                      process.wait(timeout=25)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
          PY

  # Backend validation proves the FastAPI service can lint, format-check,
  # migrate a fresh PostgreSQL database, and pass its test suite.
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      # GitHub Actions service container used only for this job.
      # The app connects through localhost:55432 from the runner.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: ai_platform
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ai_platform -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Match the local/default app config, but point PostgreSQL at the CI
      # service container instead of the Docker Compose service name.
      DATABASE_URL: postgresql+psycopg://ai_platform:local_dev_password@localhost:55432/ai_platform
      REDIS_URL: redis://localhost:6379/0
      API_CORS_ORIGINS: http://localhost:3000
      REQUIRE_DATABASE_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Ruff lint
        run: python -m ruff check apps/api

      - name: Ruff format check
        run: python -m ruff format --check apps/api

      - name: Verify Python migration contract baseline
        run: |
          python -m ruff check scripts/export_backend_contract.py
          python -m ruff format --check scripts/export_backend_contract.py
          python scripts/export_backend_contract.py --check

      # Running migrations before tests catches schema drift that unit tests
      # might miss when they rely on already-created local databases.
      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest

  # Frontend validation checks the Next.js dashboard the same way a developer
  # would before shipping: lint, TypeScript, tests, then dependency audit.
  frontend:
    name: Frontend lint, typecheck, tests, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test

      # Block known high/critical npm vulnerabilities in the dashboard supply chain.
      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  # Build production Docker images, not the dev images used by Docker Compose.
  # This catches Dockerfile/runtime issues before Kubernetes or Helm ever see them.
  docker:
    name: Production image build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: production-ai-platform-api:ci

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: production-ai-platform-web:ci

      # Trivy fails the job on high/critical vulnerabilities in the built image.
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-ai-platform-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Scan the web image separately so backend and frontend image risk is visible.
      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-ai-platform-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # Python dependency audit focuses on the production requirements file.
  # This is intentionally separate from tests so dependency risk is explicit.
  dependency-scan:
    name: Python dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.9.0

      # --strict treats audit tool problems as failures instead of silently passing.
      - name: Audit production Python dependencies
        run: python -m pip_audit -r apps/api/requirements.prod.txt --strict

  # Repository-level scan looks beyond package manifests: IaC config, secrets,
  # and filesystem vulnerabilities can fail this job.
  repository-scan:
    name: Repository vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan repository dependencies and config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # Static infrastructure checks run without creating cloud resources.
  # This job is safe for CI because it formats/lints code only; it never applies Terraform.
  infrastructure-placeholders:
    name: Infrastructure static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      # Keep Terraform formatting enforced as modules evolve.
      - name: Terraform format placeholder
        run: |
          if find infra/terraform -name '*.tf' | grep -q .; then
            terraform fmt -check -recursive infra/terraform
          else
            echo "No Terraform files yet; Phase 11 introduces Terraform."
          fi

      - name: Install Helm
        env:
          HELM_VERSION: v3.18.4
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            --output helm.tar.gz
          tar --extract --gzip --file helm.tar.gz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version --short

      # Helm lint validates the chart shape without deploying to a cluster.
      - name: Helm lint placeholder
        run: |
          if [ -f infra/helm/ai-platform/Chart.yaml ]; then
            helm lint infra/helm/ai-platform
          else
            echo "No Helm chart yet; Phase 15 introduces Helm."
          fi
