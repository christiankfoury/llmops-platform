name: CI

# Run the same validation on pushes to main and on pull requests targeting main.
# This keeps direct commits and proposed changes under the same quality gate.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  java:
    name: Java build and contract foundation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: ai_platform
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U ai_platform -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.2.16-alpine@sha256:b5dee736fa6758052556cc97b5d5423177dcd8e26ce9746e6e3d58484a5a4143
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
          --memory 128m
    env:
      JDBC_DATABASE_URL: jdbc:postgresql://localhost:55433/ai_platform
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "56379"
      TEST_REDIS_PORT: "56379"
      DATABASE_USERNAME: ai_platform
      DATABASE_PASSWORD: local_dev_password
    defaults:
      run:
        working-directory: apps/api-java
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify committed Maven Wrapper integrity
        run: sha256sum --check .mvn/wrapper/SHA256SUMS

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api-java/pom.xml

      - name: Verify Java build, formatting, and HTTP boundaries
        run: ./mvnw --batch-mode --no-transfer-progress --strict-checksums clean verify

      - name: Smoke-test the packaged Java service
        run: |
          java -jar target/production-ai-platform-api-0.1.0-SNAPSHOT-migration.jar migrate
          java -jar target/production-ai-platform-api-0.1.0-SNAPSHOT-migration.jar seed-local
          python3 - <<'PY'
          import http.client
          import json
          import os
          import socket
          import threading
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          with open("target/packaged-smoke.log", "w") as log:
              fixture_file = Path("target/operator-fixture.json")
              fixture_file.unlink(missing_ok=True)
              fixture = subprocess.Popen(["java", "../../scripts/fixtures/OperatorIdentityFixture.java", str(fixture_file)], stdout=log, stderr=subprocess.STDOUT)
              try:
                  for attempt in range(30):
                      if fixture_file.exists():
                          identity = json.loads(fixture_file.read_text())
                          break
                      if fixture.poll() is not None:
                          raise RuntimeError("Synthetic issuer failed")
                      time.sleep(1)
                  else:
                      fixture.terminate()
                      fixture.wait(timeout=10)
                      raise RuntimeError("Synthetic issuer never became ready")
                  operator_headers = {"Authorization": "Bearer " + identity["token"]}
                  app_env = {**os.environ, "OPERATOR_AUTH_MODE": "oidc", "OIDC_ISSUER": "https://operator.fixture.invalid",
                             "OIDC_AUDIENCE": "https://api.fixture.invalid", "OIDC_JWKS_URI": identity["jwks_uri"]}
                  process = subprocess.Popen([
                      "java", "-jar", "target/production-ai-platform-api-0.1.0-SNAPSHOT.jar",
                      "--server.port=18080", "--management.server.port=19080", "--platform.seed.enabled=true", "--platform.environment=local",
                  ], env=app_env, stdout=log, stderr=subprocess.STDOUT)
                  try:
                      for attempt in range(30):
                          if process.poll() is not None:
                              raise RuntimeError("Packaged service exited during startup")
                          try:
                              with urllib.request.urlopen("http://127.0.0.1:18080/health/ready", timeout=1) as response:
                                  if json.load(response)["status"] == "ready":
                                      break
                          except (OSError, urllib.error.HTTPError):
                              time.sleep(1)
                      else:
                          raise RuntimeError("Packaged service never became ready")
                      for slug in ("demo-project", "proofbase", "agentops"):
                          subprocess.run(["java", "-jar", "target/production-ai-platform-api-0.1.0-SNAPSHOT-migration.jar", "grant-operator"],
                                         env={**app_env, "OPERATOR_SUBJECT": "packaged-smoke", "OPERATOR_PROJECT_SLUG": slug, "OPERATOR_ROLE": "operator"},
                                         stdout=log, stderr=subprocess.STDOUT, check=True, timeout=15)
                      for path in ("/v1/usage/summary", "/v1/admin/prompt-versions", "/v1/operator/me"):
                          try:
                              urllib.request.urlopen("http://127.0.0.1:18080" + path, timeout=2)
                          except urllib.error.HTTPError as error:
                              assert error.code == 401
                          else:
                              raise RuntimeError("Anonymous operator endpoint exposed")
                      for path in ("/health", "/health/live"):
                          with urllib.request.urlopen("http://127.0.0.1:18080" + path, timeout=2) as response:
                              assert response.status == 200
                      for path in ("/actuator/health", "/actuator/prometheus", "/actuator/env", "/contract-test/validate"):
                          try:
                              urllib.request.urlopen("http://127.0.0.1:18080" + path, timeout=2)
                          except urllib.error.HTTPError as error:
                              assert error.code == 404
                          else:
                              raise RuntimeError("Unexpected exposed endpoint: " + path)
                      with urllib.request.urlopen("http://127.0.0.1:19080/actuator/health/readiness", timeout=2) as response:
                          assert response.status == 200 and json.load(response) == {"status": "UP"}
                      completion = urllib.request.Request(
                          "http://127.0.0.1:18080/v1/gateway/completions",
                          data=json.dumps({"input": "synthetic hello"}).encode(),
                          headers={"Content-Type": "application/json", "X-API-Key": "local-dev-placeholder-key-not-a-secret"},
                      )
                      with urllib.request.urlopen(completion, timeout=5) as response:
                          result = json.load(response)
                          assert response.status == 200 and result["status"] == "succeeded"
                          gateway_request_id = result["request_id"]
                          assert result["estimated_cost_usd"] == "0.000005"
                      for client in ("proofbase", "agentops"):
                          captured = json.loads(Path(f"../../contracts/client-captures/{client}.json").read_text())
                          for event in captured["events"].values():
                              for duplicate in (False, True):
                                  telemetry = urllib.request.Request(
                                      "http://127.0.0.1:18080/v1/usage/llm-events",
                                      data=json.dumps(event).encode(),
                                      headers={"Content-Type": "application/json", "X-API-Key": f"{client}-local-placeholder-key-not-a-secret"},
                                  )
                                  with urllib.request.urlopen(telemetry, timeout=5) as response:
                                      result = json.load(response)
                                      assert response.status == 202 and result["accepted"] is True
                                      assert result["duplicate"] is duplicate
                      with urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:18080/v1/usage/summary", headers=operator_headers), timeout=5) as response:
                          summary = json.load(response)
                          assert summary["request_count"] == 9 and summary["error_count"] == 0
                          assert summary["estimated_cost_usd"] == "0.000389"
                      for path, count in (("/v1/usage/requests", 9), ("/v1/usage/errors", 0),
                                          ("/v1/usage/scopes", 3), ("/v1/admin/prompt-versions", 3),
                                          ("/v1/admin/model-routes", 3)):
                          with urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:18080" + path, headers=operator_headers), timeout=5) as response:
                              assert len(json.load(response)) == count
                      operator = urllib.request.Request(
                          "http://127.0.0.1:18080/v1/admin/prompt-versions",
                          data=json.dumps({"project_slug": "demo-project", "application_slug": "demo-app",
                                           "name": "packaged-operator", "content": "Synthetic packaged prompt."}).encode(),
                          headers={"Content-Type": "application/json", **operator_headers},
                      )
                      with urllib.request.urlopen(operator, timeout=5) as response:
                          prompt = json.load(response)
                          assert response.status == 201 and prompt["version"] == 1 and prompt["is_active"] is True
                      # Rejected/chunked bodies must not reach authentication, provider execution or persistence.
                      chunked = http.client.HTTPConnection("127.0.0.1", 18080, timeout=5)
                      try:
                          chunked.request("POST", "/v1/gateway/completions", body=iter([b"x" * 20000, b"x" * 20000]),
                                          headers={"Content-Type": "application/json"}, encode_chunked=True)
                          result = chunked.getresponse()
                          assert result.status == 413
                          result.read()
                      finally:
                          chunked.close()
                      for trickle in (False, True):
                          connection = socket.create_connection(("127.0.0.1", 18080), timeout=2)
                          connection.settimeout(8)
                          stop = threading.Event()
                          sender = None
                          try:
                              connection.sendall(b"POST /v1/gateway/completions HTTP/1.1\r\nHost: localhost:18080\r\nContent-Type: application/json\r\nContent-Length: 1000\r\nConnection: close\r\n\r\n{")
                              if trickle:
                                  def send_fragments():
                                      try:
                                          while not stop.wait(0.5):
                                              connection.sendall(b"x")
                                      except OSError:
                                          pass
                                  sender = threading.Thread(target=send_fragments, daemon=True)
                                  sender.start()
                              started = time.monotonic()
                              received = b""
                              while b"\r\n" not in received:
                                  chunk = connection.recv(1024)
                                  if not chunk:
                                      break
                                  received += chunk
                              assert received.startswith(b"HTTP/1.1 408"), received.split(b"\r\n", 1)[0]
                              assert time.monotonic() - started < 7
                          finally:
                              stop.set()
                              connection.close()
                              if sender is not None:
                                  sender.join(timeout=2)
                      with urllib.request.urlopen("http://127.0.0.1:19080/actuator/prometheus", timeout=2) as response:
                          metrics = response.read(2_000_000).decode()
                      for name in ("http_requests_total", "llm_gateway_requests_total", "llm_gateway_request_duration_seconds_bucket",
                                   "llm_gateway_estimated_cost_usd_total", "llm_external_telemetry_events_total", "platform_dependency_up"):
                          assert name in metrics, name
                      log.flush()
                      records = [json.loads(line) for line in Path("target/packaged-smoke.log").read_text().splitlines() if line.startswith('{')]
                      requests = [record for record in records if record.get("event") == "request_completed"]
                      assert any(record.get("gateway_request_id") == gateway_request_id and len(record["trace_id"]) == 32 for record in requests)
                      encoded = json.dumps(requests)
                      assert "synthetic hello" not in encoded and "local-dev-placeholder-key-not-a-secret" not in encoded
                      print("Packaged Java health, gateway, telemetry/replay, operator, bounded-body, private metrics and correlated log checks passed")
                  finally:
                      process.terminate()
                      try:
                          process.wait(timeout=25)
                      except subprocess.TimeoutExpired:
                          process.kill()
                          process.wait(timeout=5)
              finally:
                  if fixture.poll() is None:
                      fixture.terminate()
                      fixture.wait(timeout=10)
                  fixture_file.unlink(missing_ok=True)
          PY

  # Backend validation proves the FastAPI service can lint, format-check,
  # migrate a fresh PostgreSQL database, and pass its test suite.
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      # GitHub Actions service container used only for this job.
      # The app connects through localhost:55432 from the runner.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: ai_platform
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ai_platform -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Match the local/default app config, but point PostgreSQL at the CI
      # service container instead of the Docker Compose service name.
      DATABASE_URL: postgresql+psycopg://ai_platform:local_dev_password@localhost:55432/ai_platform
      REDIS_URL: redis://localhost:6379/0
      API_CORS_ORIGINS: http://localhost:3000
      REQUIRE_DATABASE_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Ruff lint
        run: python -m ruff check apps/api

      - name: Ruff format check
        run: python -m ruff format --check apps/api

      - name: Verify Python migration contract baseline
        run: |
          python -m ruff check scripts/export_backend_contract.py scripts/capture_client_telemetry_contract.py
          python -m ruff format --check scripts/export_backend_contract.py scripts/capture_client_telemetry_contract.py
          python scripts/export_backend_contract.py --check

      # Running migrations before tests catches schema drift that unit tests
      # might miss when they rely on already-created local databases.
      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest

  # Frontend validation checks the Next.js dashboard the same way a developer
  # would before shipping: lint, TypeScript, tests, then dependency audit.
  frontend:
    name: Frontend lint, typecheck, tests, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test

      # Block known high/critical npm vulnerabilities in the dashboard supply chain.
      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  # Build production Docker images, not the dev images used by Docker Compose.
  # This catches Dockerfile/runtime issues before Kubernetes or Helm ever see them.
  docker:
    name: Production image build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api-java/Dockerfile
          target: api
          load: true
          push: false
          tags: |
            production-ai-platform-api:ci
            production-ai-platform-api:local

      - name: Build migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api-java/Dockerfile
          target: migration
          load: true
          push: false
          tags: |
            production-ai-platform-migration:ci
            production-ai-platform-migration:local

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: |
            production-ai-platform-web:ci
            production-ai-platform-web:local

      - name: Fresh Java Compose stack and verified data TLS
        run: python3 scripts/validate_java_container_stack.py

      - name: Scan migration image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-ai-platform-migration:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Trivy fails the job on high/critical vulnerabilities in the built image.
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-ai-platform-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      # Scan the web image separately so backend and frontend image risk is visible.
      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-ai-platform-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # Python dependency audit focuses on the production requirements file.
  # This is intentionally separate from tests so dependency risk is explicit.
  dependency-scan:
    name: Python dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.9.0

      # --strict treats audit tool problems as failures instead of silently passing.
      - name: Audit production Python dependencies
        run: python -m pip_audit -r apps/api/requirements.prod.txt --strict

  # Repository-level scan looks beyond package manifests: IaC config, secrets,
  # and filesystem vulnerabilities can fail this job.
  repository-scan:
    name: Repository vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan repository dependencies and config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # No AWS credentials, backend initialization, real plans, apply or cluster mutation.
  infrastructure:
    name: Infrastructure static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install checksum-pinned Terraform, Helm and kubeconform
        run: |
          python scripts/install_validation_tools.py
          echo "$GITHUB_WORKSPACE/.maven-cache/tools/pinned" >> "$GITHUB_PATH"
          python -m pip install PyYAML==6.0.3

      - name: Validate every Terraform environment and mocked bootstrap plan
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform
          mkdir -p "$GITHUB_WORKSPACE/.maven-cache/terraform-provider-cache"
          export TF_PLUGIN_CACHE_DIR="$GITHUB_WORKSPACE/.maven-cache/terraform-provider-cache"
          for environment in dev staging prod; do
            export TF_DATA_DIR="$GITHUB_WORKSPACE/.maven-cache/terraform-$environment"
            terraform -chdir="infra/terraform/environments/$environment" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/terraform/environments/$environment" validate -no-color
            terraform -chdir="infra/terraform/environments/$environment" test -no-color
          done

      - name: Validate application runtime and Kubernetes bootstrap boundaries
        run: |
          python scripts/validate_java_manifests.py
          python scripts/validate_aws_manifests.py

      # Scan the exact reviewed controller/bootstrap configuration, not unused archive defaults.
      - name: Scan rendered deployment configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .maven-cache/aws-manifest-validation/rendered
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
