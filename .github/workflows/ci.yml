name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_platform
          POSTGRES_USER: ai_platform
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ai_platform -d ai_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://ai_platform:local_dev_password@localhost:55432/ai_platform
      REDIS_URL: redis://localhost:6379/0
      API_CORS_ORIGINS: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Ruff lint
        run: python -m ruff check apps/api

      - name: Ruff format check
        run: python -m ruff format --check apps/api

      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run backend tests
        run: python -m pytest

  frontend:
    name: Frontend lint, typecheck, tests, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test

      - name: Frontend dependency audit
        run: npm audit --audit-level=high

  docker:
    name: Production image build and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: production-ai-platform-api:ci

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: production-ai-platform-web:ci

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-ai-platform-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: production-ai-platform-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  dependency-scan:
    name: Python dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.9.0

      - name: Audit production Python dependencies
        run: python -m pip_audit -r apps/api/requirements.prod.txt --strict

  repository-scan:
    name: Repository vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan repository dependencies and config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config,secret
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  infrastructure-placeholders:
    name: Infrastructure static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format placeholder
        run: |
          if find infra/terraform -name '*.tf' | grep -q .; then
            terraform fmt -check -recursive infra/terraform
          else
            echo "No Terraform files yet; Phase 11 introduces Terraform."
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint placeholder
        run: |
          if [ -f infra/helm/ai-platform/Chart.yaml ]; then
            helm lint infra/helm/ai-platform
          else
            echo "No Helm chart yet; Phase 15 introduces Helm."
          fi
