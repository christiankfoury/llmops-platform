name: TargetGroupBinding compatibility
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/validate_tgb_controller.py
      - scripts/validate_aws_manifests.py
      - infra/validation/charts.json
      - infra/validation/tgb/**
      - infra/bootstrap/**
      - infra/terraform/modules/load-balancing/**
      - .github/workflows/tgb-compatibility.yml
  push:
    branches: [main]
    paths:
      - scripts/validate_tgb_controller.py
      - scripts/validate_aws_manifests.py
      - infra/validation/charts.json
      - infra/validation/tgb/**
      - infra/bootstrap/**
      - infra/terraform/modules/load-balancing/**
      - .github/workflows/tgb-compatibility.yml
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: |
          python scripts/install_validation_tools.py
          echo "$GITHUB_WORKSPACE/.maven-cache/tools/pinned" >> "$GITHUB_PATH"
          python -m pip install PyYAML==6.0.3
          curl --fail --location https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o /tmp/kind
          cd /tmp
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum --check
          chmod +x /tmp/kind
          echo /tmp >> "$GITHUB_PATH"
      - name: Test pinned controller lifecycle and denied operations without AWS
        run: python scripts/validate_tgb_controller.py
      - name: Retain synthetic compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tgb-compatibility
          path: |
            .maven-cache/tgb-compatibility/evidence.json
            .maven-cache/tgb-compatibility/controller.log
            .maven-cache/tgb-compatibility/aws-calls.json
          retention-days: 7
