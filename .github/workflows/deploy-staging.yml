name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA or immutable tag to build, publish, and deploy. Defaults to the triggering ref SHA.
        required: false
        type: string
      release_notes:
        description: Short release notes for the staging promotion summary.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Build, publish, and deploy staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_STAGING_DEPLOY_ROLE_ARN: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
      STAGING_EKS_CLUSTER_NAME: ${{ vars.STAGING_EKS_CLUSTER_NAME }}
      STAGING_NAMESPACE: ${{ vars.STAGING_NAMESPACE }}
      STAGING_API_HOST: ${{ vars.STAGING_API_HOST }}
      STAGING_WEB_HOST: ${{ vars.STAGING_WEB_HOST }}
      STAGING_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
      STAGING_WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL }}
      STAGING_API_ECR_REPOSITORY: ${{ vars.STAGING_API_ECR_REPOSITORY }}
      STAGING_WEB_ECR_REPOSITORY: ${{ vars.STAGING_WEB_ECR_REPOSITORY }}
      INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
      RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID as a repository variable.}"
          : "${AWS_REGION:?Set AWS_REGION as a repository variable.}"
          : "${AWS_STAGING_DEPLOY_ROLE_ARN:?Set AWS_STAGING_DEPLOY_ROLE_ARN as a repository variable.}"
          : "${STAGING_EKS_CLUSTER_NAME:?Set STAGING_EKS_CLUSTER_NAME as a repository variable.}"
          : "${STAGING_API_HOST:?Set STAGING_API_HOST as a repository variable.}"
          : "${STAGING_WEB_HOST:?Set STAGING_WEB_HOST as a repository variable.}"
          : "${STAGING_API_BASE_URL:?Set STAGING_API_BASE_URL as a repository variable.}"
          : "${STAGING_WEB_BASE_URL:?Set STAGING_WEB_BASE_URL as a repository variable.}"

          {
            echo "STAGING_NAMESPACE=${STAGING_NAMESPACE:-ai-platform-staging}"
            echo "STAGING_API_ECR_REPOSITORY=${STAGING_API_ECR_REPOSITORY:-production-ai-platform-staging/api}"
            echo "STAGING_WEB_ECR_REPOSITORY=${STAGING_WEB_ECR_REPOSITORY:-production-ai-platform-staging/web}"
            echo "IMAGE_TAG=${INPUT_IMAGE_TAG:-$GITHUB_SHA}"
            echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          } >> "$GITHUB_ENV"

      - name: Write release summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Staging release"
            echo ""
            echo "- Ref: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image tag: \`${INPUT_IMAGE_TAG:-$GITHUB_SHA}\`"
            echo ""
            echo "### Release notes"
            printf '%s\n' "${RELEASE_NOTES:-No release notes provided.}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_STAGING_DEPLOY_ROLE_ARN }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.STAGING_API_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.STAGING_WEB_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure staging Kubernetes context
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$STAGING_EKS_CLUSTER_NAME"

      - name: Deploy staging release
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install ai-platform-staging infra/helm/ai-platform \
            --namespace "$STAGING_NAMESPACE" \
            --values infra/helm/ai-platform/values-staging.yaml \
            --atomic \
            --wait \
            --timeout 15m \
            --set namespace.create=false \
            --set-string api.image.repository="$ECR_REGISTRY/$STAGING_API_ECR_REPOSITORY" \
            --set-string api.image.tag="$IMAGE_TAG" \
            --set-string web.image.repository="$ECR_REGISTRY/$STAGING_WEB_ECR_REPOSITORY" \
            --set-string web.image.tag="$IMAGE_TAG" \
            --set-string api.config.corsOrigins="$STAGING_WEB_BASE_URL" \
            --set-string web.config.apiBaseUrl="$STAGING_API_BASE_URL" \
            --set-string ingress.apiHost="$STAGING_API_HOST" \
            --set-string ingress.webHost="$STAGING_WEB_HOST"

      - name: Check rollout status
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/ai-platform-staging-api --namespace "$STAGING_NAMESPACE" --timeout=10m
          kubectl rollout status deployment/ai-platform-staging-web --namespace "$STAGING_NAMESPACE" --timeout=10m

      - name: Smoke test staging
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$STAGING_API_BASE_URL/health/ready"
          curl --fail --show-error --silent "$STAGING_WEB_BASE_URL" > /dev/null
