name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA or immutable tag to build, publish, and deploy. Defaults to the triggering ref SHA.
        required: false
        type: string
      release_notes:
        description: Production release notes and validation summary.
        required: true
        type: string
      confirmation:
        description: Type deploy-prod to confirm this production deployment request.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-prod:
    name: Build, publish, and deploy prod
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PROD_DEPLOY_ROLE_ARN: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
      PROD_EKS_CLUSTER_NAME: ${{ vars.PROD_EKS_CLUSTER_NAME }}
      PROD_NAMESPACE: ${{ vars.PROD_NAMESPACE }}
      PROD_API_HOST: ${{ vars.PROD_API_HOST }}
      PROD_WEB_HOST: ${{ vars.PROD_WEB_HOST }}
      PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
      PROD_WEB_BASE_URL: ${{ vars.PROD_WEB_BASE_URL }}
      PROD_API_ECR_REPOSITORY: ${{ vars.PROD_API_ECR_REPOSITORY }}
      PROD_WEB_ECR_REPOSITORY: ${{ vars.PROD_WEB_ECR_REPOSITORY }}
      INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
      RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
      PROD_DEPLOY_CONFIRMATION: ${{ github.event.inputs.confirmation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm production deployment request
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROD_DEPLOY_CONFIRMATION" != "deploy-prod" ]; then
            echo "Production deployment requires confirmation value deploy-prod." >&2
            exit 1
          fi

      - name: Resolve deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${AWS_ACCOUNT_ID:?Set AWS_ACCOUNT_ID as a repository variable.}"
          : "${AWS_REGION:?Set AWS_REGION as a repository variable.}"
          : "${AWS_PROD_DEPLOY_ROLE_ARN:?Set AWS_PROD_DEPLOY_ROLE_ARN as a repository variable.}"
          : "${PROD_EKS_CLUSTER_NAME:?Set PROD_EKS_CLUSTER_NAME as a repository variable.}"
          : "${PROD_API_HOST:?Set PROD_API_HOST as a repository variable.}"
          : "${PROD_WEB_HOST:?Set PROD_WEB_HOST as a repository variable.}"
          : "${PROD_API_BASE_URL:?Set PROD_API_BASE_URL as a repository variable.}"
          : "${PROD_WEB_BASE_URL:?Set PROD_WEB_BASE_URL as a repository variable.}"

          {
            echo "PROD_NAMESPACE=${PROD_NAMESPACE:-ai-platform-prod}"
            echo "PROD_API_ECR_REPOSITORY=${PROD_API_ECR_REPOSITORY:-production-ai-platform-prod/api}"
            echo "PROD_WEB_ECR_REPOSITORY=${PROD_WEB_ECR_REPOSITORY:-production-ai-platform-prod/web}"
            echo "IMAGE_TAG=${INPUT_IMAGE_TAG:-$GITHUB_SHA}"
            echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          } >> "$GITHUB_ENV"

      - name: Write release summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Production release"
            echo ""
            echo "- Ref: \`$GITHUB_REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image tag: \`${INPUT_IMAGE_TAG:-$GITHUB_SHA}\`"
            echo ""
            echo "### Release notes and validation"
            printf '%s\n' "$RELEASE_NOTES"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_PROD_DEPLOY_ROLE_ARN }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.PROD_API_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.PROD_WEB_ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.18.4

      - name: Configure prod Kubernetes context
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$PROD_EKS_CLUSTER_NAME"

      - name: Deploy prod release
        shell: bash
        run: |
          set -euo pipefail
          helm upgrade --install ai-platform-prod infra/helm/ai-platform \
            --namespace "$PROD_NAMESPACE" \
            --values infra/helm/ai-platform/values-prod.yaml \
            --atomic \
            --wait \
            --timeout 20m \
            --set namespace.create=false \
            --set-string api.image.repository="$ECR_REGISTRY/$PROD_API_ECR_REPOSITORY" \
            --set-string api.image.tag="$IMAGE_TAG" \
            --set-string web.image.repository="$ECR_REGISTRY/$PROD_WEB_ECR_REPOSITORY" \
            --set-string web.image.tag="$IMAGE_TAG" \
            --set-string api.config.corsOrigins="$PROD_WEB_BASE_URL" \
            --set-string web.config.apiBaseUrl="$PROD_API_BASE_URL" \
            --set-string ingress.apiHost="$PROD_API_HOST" \
            --set-string ingress.webHost="$PROD_WEB_HOST"

      - name: Check rollout status
        shell: bash
        run: |
          set -euo pipefail
          kubectl rollout status deployment/ai-platform-prod-api --namespace "$PROD_NAMESPACE" --timeout=15m
          kubectl rollout status deployment/ai-platform-prod-web --namespace "$PROD_NAMESPACE" --timeout=15m

      - name: Smoke test prod
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent "$PROD_API_BASE_URL/health/ready"
          curl --fail --show-error --silent "$PROD_WEB_BASE_URL" > /dev/null
