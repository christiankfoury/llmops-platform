name: Deploy prod
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit from successful main CI
        required: true
        type: string
      ci_run_id:
        description: Successful exact-revision CI run ID
        required: true
        type: string
      schema_version:
        description: Declared post-migration schema version
        required: true
        default: '2'
        type: string
      previous_run_id:
        description: Previous environment's successful deployment run ID (0 for dev)
        default: '0'
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: aws-release-prod
  cancel-in-progress: false
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      environment: prod
      operation: deploy
      sha: ${{ inputs.sha }}
      ci_run_id: ${{ inputs.ci_run_id }}
      schema_version: ${{ inputs.schema_version }}
      previous_run_id: ${{ inputs.previous_run_id }}
