spring.application.name=production-ai-platform-api
spring.main.banner-mode=off
server.address=${API_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=40s
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-path=never
spring.web.error.whitelabel.enabled=false
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:55432/ai_platform}
spring.datasource.username=${DATABASE_USERNAME:ai_platform}
spring.datasource.password=${DATABASE_PASSWORD:local_dev_password}
spring.datasource.hikari.connection-timeout=1000
spring.datasource.hikari.validation-timeout=500
spring.datasource.hikari.data-source-properties.connectTimeout=2
spring.datasource.hikari.data-source-properties.socketTimeout=3
spring.datasource.hikari.data-source-properties.cancelSignalTimeout=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${DATABASE_MIGRATIONS_ENABLED:false}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
platform.environment=${ENVIRONMENT:local}
platform.seed.enabled=${SEED_LOCAL_DATA:false}
spring.datasource.hikari.schema=${DATABASE_SCHEMA:public}
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:public}
spring.flyway.default-schema=${DATABASE_SCHEMA:public}
spring.flyway.schemas=${DATABASE_SCHEMA:public}
gateway.provider.max-attempts=${PROVIDER_MAX_ATTEMPTS:2}
gateway.provider.timeout=${PROVIDER_TIMEOUT_SECONDS:15}s
gateway.provider.retry-backoff=${PROVIDER_RETRY_BACKOFF_MS:100}ms
gateway.provider.concurrency=${PROVIDER_CONCURRENCY:8}

operator.security.mode=${OPERATOR_AUTH_MODE:disabled}
operator.security.issuer=${OIDC_ISSUER:}
operator.security.audience=${OIDC_AUDIENCE:}
operator.security.jwks-uri=${OIDC_JWKS_URI:}
operator.security.environment=${ENVIRONMENT:local}

server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=5s
server.tomcat.threads.max=64
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=256
server.tomcat.accept-count=128
server.max-http-request-header-size=8KB
spring.data.redis.repositories.enabled=false
platform.redis.host=${REDIS_HOST:127.0.0.1}
platform.redis.port=${REDIS_PORT:6379}
platform.redis.username=${REDIS_USERNAME:}
platform.redis.password=${REDIS_PASSWORD:}
platform.redis.tls=${REDIS_TLS_ENABLED:false}
platform.redis.environment=${ENVIRONMENT:local}
platform.limits.namespace=${LIMITS_NAMESPACE:ai-platform-${ENVIRONMENT:local}}
platform.limits.global-limit=${GLOBAL_REQUEST_LIMIT:600}
platform.limits.gateway-limit=${GATEWAY_KEY_REQUEST_LIMIT:60}
platform.limits.telemetry-limit=${TELEMETRY_KEY_REQUEST_LIMIT:300}
platform.limits.window=${RATE_LIMIT_WINDOW_SECONDS:60}s
platform.limits.concurrent-requests=${MAX_CONCURRENT_REQUESTS:32}

management.endpoint.health.group.readiness.include=readinessState,platformDependencies
management.endpoint.health.group.liveness.include=livenessState

management.endpoint.prometheus.access=read-only
management.server.port=${MANAGEMENT_PORT:9080}
management.server.address=${MANAGEMENT_BIND_ADDRESS:127.0.0.1}
platform.observability.endpoint=${OTLP_TRACES_ENDPOINT:}
platform.observability.sample-probability=${TRACE_SAMPLE_PROBABILITY:0.1}
platform.observability.environment=${ENVIRONMENT:local}
logging.structured.format.console=dev.christiankfoury.aiplatform.observability.SafeLogFormatter
logging.structured.format.file=dev.christiankfoury.aiplatform.observability.SafeLogFormatter

platform.seed.allow-compose-network=${SEED_ALLOW_COMPOSE_NETWORK:false}
