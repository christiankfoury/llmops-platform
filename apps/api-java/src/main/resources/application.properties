spring.application.name=production-ai-platform-api
spring.main.banner-mode=off
server.address=${API_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-path=never
spring.web.error.whitelabel.enabled=false
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:55432/ai_platform}
spring.datasource.username=${DATABASE_USERNAME:ai_platform}
spring.datasource.password=${DATABASE_PASSWORD:local_dev_password}
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${DATABASE_MIGRATIONS_ENABLED:false}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
platform.environment=${ENVIRONMENT:local}
platform.seed.enabled=${SEED_LOCAL_DATA:false}
spring.datasource.hikari.schema=${DATABASE_SCHEMA:public}
spring.jpa.properties.hibernate.default_schema=${DATABASE_SCHEMA:public}
spring.flyway.default-schema=${DATABASE_SCHEMA:public}
spring.flyway.schemas=${DATABASE_SCHEMA:public}
